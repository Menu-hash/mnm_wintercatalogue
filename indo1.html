<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>MM Clothing – 2026 Catalogue</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#f2f0eb;color:#111;}

nav{background:#111;display:flex;align-items:center;justify-content:space-between;padding:10px 24px;position:sticky;top:0;z-index:200;}
.logo{display:flex;align-items:center;gap:10px;}
.logo img{height:46px;width:auto;filter:invert(1);display:block;}
.logo-text{display:flex;flex-direction:column;line-height:1.1;}
.logo-name{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:#fff;letter-spacing:.1em;}
.logo-tag{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:#e8370d;font-weight:700;}
.nr{display:flex;gap:8px;}
.bq{background:#e8370d;color:#fff;border:none;padding:9px 18px;font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;}
.bq:hover{background:#c72d07;}
.bw{background:#25d366;color:#fff;border:none;padding:9px 18px;font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:5px;text-decoration:none;}
.bw:hover{background:#1eba55;}

.hero{background:#111;color:#fff;text-align:center;padding:70px 24px 56px;}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(4rem,11vw,9rem);line-height:.9;letter-spacing:.04em;}
.hero h1 em{color:#e8370d;font-style:normal;}
.hero p{margin:18px auto 0;max-width:400px;color:rgba(255,255,255,.5);line-height:1.7;}
.hb{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.bp{background:#e8370d;color:#fff;border:none;padding:13px 28px;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;}
.bp:hover{background:#c72d07;}
.bwh{background:#25d366;color:#fff;border:none;padding:13px 28px;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;}
.bwh:hover{background:#1eba55;}

.tb{background:#fff;border-bottom:2px solid #e0ddd6;position:sticky;top:67px;z-index:190;overflow-x:auto;white-space:nowrap;}
.tb button{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;padding:13px 18px;font-family:'DM Sans',sans-serif;font-size:.77rem;letter-spacing:.1em;text-transform:uppercase;color:#888;cursor:pointer;}
.tb button.active,.tb button:hover{color:#e8370d;border-bottom-color:#e8370d;}

.gs{padding:26px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.card[hidden]{display:none;}
.card{background:#fff;overflow:hidden;}

.iw{position:relative;overflow:hidden;}
.iw img{width:100%;display:block;transition:transform .4s;}
.card:hover .iw img{transform:scale(1.04);}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:flex-end;padding:16px;opacity:0;transition:opacity .25s;}
.card:hover .ov{opacity:1;}
.ov button{width:100%;background:#e8370d;color:#fff;border:none;padding:12px;font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;}
.ov button:hover{background:#c72d07;}
.ci{padding:12px 15px 16px;}
.ci span{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:#e8370d;}
.ci h3{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.05em;margin-top:3px;}

.cta{background:#e8370d;color:#fff;text-align:center;padding:54px 24px;}
.cta h2{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,6vw,4rem);letter-spacing:.05em;margin-bottom:12px;}
.cta p{font-size:.93rem;opacity:.85;max-width:380px;margin:0 auto 26px;line-height:1.7;}
.bcta{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#25d366;border:none;padding:14px 30px;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;}

.om{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:20px;}
.om.open{display:flex;}
.modal{background:#fff;width:100%;max-width:430px;padding:34px 28px;position:relative;}
.mx{position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#aaa;line-height:1;}
.mx:hover{color:#111;}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:.06em;margin-bottom:4px;}
.modal>p{font-size:.82rem;color:#888;margin-bottom:20px;}
.f{margin-bottom:13px;}
.f label{display:block;font-size:.67rem;letter-spacing:.14em;text-transform:uppercase;color:#999;margin-bottom:5px;}
.f input,.f select,.f textarea{width:100%;border:1.5px solid #ddd;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#e8370d;}
.f textarea{resize:vertical;min-height:65px;}
.sb{width:100%;background:#25d366;color:#fff;border:none;padding:13px;font-weight:700;font-size:.86rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
.sb:hover{background:#1eba55;}

.waf{position:fixed;bottom:26px;right:26px;z-index:998;width:56px;height:56px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(37,211,102,.5);text-decoration:none;transition:transform .2s;}
.waf:hover{transform:scale(1.1);}
.waf svg{width:27px;height:27px;}
.pulse{position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(37,211,102,.5);animation:pulse 2s ease-out infinite;}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.6);opacity:0}}
.tip{position:absolute;right:64px;background:#111;color:#fff;padding:6px 11px;font-size:.72rem;font-weight:600;white-space:nowrap;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s;}
.waf:hover .tip{opacity:1;}

footer{background:#111;color:rgba(255,255,255,.3);text-align:center;padding:22px;font-size:.75rem;}
@media(max-width:560px){nav{padding:10px 14px;}.logo img{height:36px;}.hero{padding:52px 16px 44px;}.gs{padding:14px;}.grid{gap:10px;}.nr{gap:6px;}.bq,.bw{padding:8px 12px;font-size:.7rem;}}

.embroidery-section{padding:28px 24px;background:#fff}.embroidery-section h2{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;text-align:center}.embroidery-section p{text-align:center;color:#666}.embroidery-carousel{position:relative;overflow:hidden;border-radius:18px;height:320px;max-width:1200px;margin:20px auto}.embroidery-slide{position:absolute;inset:0;opacity:0;transition:.6s}.embroidery-slide.active{opacity:1}.embroidery-slide img{width:100%;height:100%;object-fit:cover}.embroidery-overlay{position:absolute;left:0;right:0;bottom:0;color:#fff;padding:24px;background:linear-gradient(transparent,rgba(0,0,0,.8))}.embroidery-btn{display:inline-block;background:#25d366;color:#fff;text-decoration:none;padding:10px 18px;border-radius:6px}

.embroidery-dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.embroidery-dot{width:10px;height:10px;border-radius:50%;background:#bbb;cursor:pointer}
.embroidery-dot.active{background:#25d366}
.emb-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:none;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:20px}
.emb-prev{left:12px}.emb-next{right:12px}
</style>
</head>
